<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111c35" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6" />
    </linearGradient>

    <!-- Blue Arrow Gradient (Teach) -->
    <linearGradient id="blueArrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Emerald Arrow Gradient (Learn / Swap) -->
    <linearGradient id="emeraldArrow" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Top Arrow: Teach (Blue) pointing right -->
  <g filter="url(#glowBlue)">
    <!-- Path from left node to right arrow tip -->
    <path
      d="M 155 195 L 315 195 C 330 195 330 195 330 195"
      fill="none"
      stroke="url(#blueArrow)"
      stroke-width="38"
      stroke-linecap="round"
    />
    <!-- Arrowhead pointing right -->
    <path
      d="M 285 140 L 375 195 L 285 250"
      fill="none"
      stroke="url(#blueArrow)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Start node circle -->
    <circle cx="155" cy="195" r="26" fill="#38bdf8" />
    <circle cx="155" cy="195" r="14" fill="#0f172a" />
  </g>

  <!-- Bottom Arrow: Learn (Emerald) pointing left -->
  <g filter="url(#glowEmerald)">
    <!-- Path from right node to left arrow tip -->
    <path
      d="M 357 317 L 197 317"
      fill="none"
      stroke="url(#emeraldArrow)"
      stroke-width="38"
      stroke-linecap="round"
    />
    <!-- Arrowhead pointing left -->
    <path
      d="M 227 262 L 137 317 L 227 372"
      fill="none"
      stroke="url(#emeraldArrow)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Start node circle -->
    <circle cx="357" cy="317" r="26" fill="#34d399" />
    <circle cx="357" cy="317" r="14" fill="#0f172a" />
  </g>

  <!-- Central connecting energy spark -->
  <circle cx="256" cy="256" r="10" fill="#ffffff" opacity="0.8" />
</svg>
